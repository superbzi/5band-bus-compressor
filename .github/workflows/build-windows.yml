name: Build Windows VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-2022

    steps:
      -code

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      -CMake (JUCE / VST3)G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: |
          cmake --build build --config Release --target SSL5BandCompressor_VST3

      - name: Upload VST3 Artifact
        with:
          name: SSL5BandCompressor-Windows-x64
          path: build/**/VST3/**
